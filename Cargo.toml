[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
publish = false
rust-version = "1.93.1"

[workspace.dependencies]
quick-xml = "=0.39.2"
flate2 = "=1.1.9"
crc32fast = "=1.5.0"
unicode-segmentation = "=1.13.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
schemars = "=1.2.2"
sha2 = "=0.10.9"
getrandom = "=0.3.4"
png = "=0.18.1"
zune-jpeg = "=0.5.15"
rustix = { version = "=1.1.4", features = ["fs"] }
thiserror = "=2.0.20"
clap = { version = "=4.6.6", features = ["derive"] }
hae-diag = { path = "crates/hae-diag" }
hae-zip = { path = "crates/hae-zip" }
hae-xml = { path = "crates/hae-xml" }
hae-package = { path = "crates/hae-package" }
hae-model = { path = "crates/hae-model" }
hae-edit = { path = "crates/hae-edit" }
hae-verify = { path = "crates/hae-verify" }
hae-project = { path = "crates/hae-project" }
hae-exec = { path = "crates/hae-exec" }
hae-cli = { path = "crates/hae-cli" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
